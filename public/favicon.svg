<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#grad)"/>

  <!-- Calculator body -->
  <rect x="6" y="5" width="20" height="22" rx="3" fill="white" opacity="0.95"/>

  <!-- Screen -->
  <rect x="8" y="7" width="16" height="6" rx="1.5" fill="#1e293b"/>

  <!-- 9.0 text -->
  <text x="16" y="12" font-family="system-ui, sans-serif" font-size="5" font-weight="700" fill="#22d3ee" text-anchor="middle">9.0</text>

  <!-- Buttons simplified -->
  <rect x="8" y="15" width="4" height="3" rx="0.8" fill="#f1f5f9"/>
  <rect x="14" y="15" width="4" height="3" rx="0.8" fill="#f1f5f9"/>
  <rect x="20" y="15" width="4" height="3" rx="0.8" fill="#fbbf24"/>

  <rect x="8" y="20" width="4" height="3" rx="0.8" fill="#f1f5f9"/>
  <rect x="14" y="20" width="4" height="3" rx="0.8" fill="#f1f5f9"/>
  <rect x="20" y="20" width="4" height="3" rx="0.8" fill="#3b82f6"/>

  <!-- Small graduation cap hint -->
  <polygon points="27,3 30,4.5 27,6 24,4.5" fill="white" opacity="0.9"/>

  <!-- Check mark -->
  <circle cx="26" cy="25" r="3" fill="#22c55e"/>
  <polyline points="24.5,25 25.5,26 27.5,24" fill="none" stroke="white" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
